<body>
    <h1> Hace mucha calor</h1>
    <input type="number" id="Input" placeholder="Ingresa la temperatura">
    <button onclick="verificarBtn()">Verificar</button>
    <p id="p">La temperatura es</p>





    <script>

        function verificarBtn() {

        let temperatura = Number(document.querySelector("#Input").value);
        let p = document.querySelector("#p");
        
        if (temperatura <= 10){
            p.textContent = "Hace frio 🥶🔵";
        }
        
        else if (temperatura <= 20 ){
            p.textContent = "Está templado 😐🟡";
        }

        else if (temperatura <= 30 ){
            p.textContent = "Ya está haciendo calor 🥵🔴";
        }

        else if (temperatura <= 35 ){
            p.textContent = "Te estás quemando 🥵🔥";
        }

        else {
            p.textContent = "Te Mueres de  calor 🥵🔥";
        }
    }
    </script>
